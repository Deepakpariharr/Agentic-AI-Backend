; Evals get their own pytest config so they don't inherit the unit-test one in
; the project root: its --cov/fail_under would fail every eval run, and its
; testpaths would pull in the (mocked) unit tests.
;
; Run with:   deepeval test run evals/agent/
;        or:  pytest evals/agent/            (same tests, plainer output)
[pytest]
testpaths = .
; `../..` = project root, so `services`, `config` etc. import as they do in the app.
pythonpath = . ../..
markers =
    tools: agent picks (or skips) the right tool and uses its result
    pdf: answers grounded in an uploaded PDF
    memory: multi-turn memory and per-user isolation
    safety: injection, prompt-extraction and honesty checks
    external: needs a third-party API key (RapidAPI / Tavily)
