AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MCPBE FastAPI backend running on Lambda (container image) behind an HTTP API.

# NOTE: config and secrets come from SSM Parameter Store (Standard tier), not
# Secrets Manager — same KMS encryption, but free rather than $0.40/secret/month.
# Secrets Manager's headline feature is automatic rotation, which AWS can't do
# for third-party keys (OpenAI, Firebase, RapidAPI) anyway, so there is nothing
# to gain by paying for it here.

# All application config/secrets now live in SSM Parameter Store under
# /mcpbe/<AppEnv>/ — the only thing the stack needs to know is which namespace
# to read. Nothing secret is passed on the command line or stored in the image.
Parameters:
  AppEnv:
    Type: String
    Default: prod
    AllowedValues: ["prod", "qa"]
    Description: Which SSM namespace (/mcpbe/<AppEnv>/) this stack reads its config from
  FirebaseProjectId:
    Type: String
    Default: mcpfrontend
    Description: Firebase project whose ID tokens the API accepts (not a secret; it's in the frontend config too)

Globals:
  Function:
    Timeout: 30
    MemorySize: 512

Resources:
  # Explicit HTTP API (instead of SAM's auto-generated implicit one) so we can
  # set a global throttle. This is a coarse, account-wide safety net against
  # abuse/runaway cost — it does NOT replace the per-user "5/minute" limiter
  # already in the app code (middleware/rate_limiter.py); see README for why
  # that in-memory limiter alone isn't reliable across Lambda instances.
  MCPBEHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      DefaultRouteSettings:
        ThrottlingRateLimit: 10   # sustained requests/second, across all clients
        ThrottlingBurstLimit: 20  # short burst allowance above the steady rate
      # Every route needs a valid Firebase ID token unless its event below says
      # `Authorizer: NONE`. API Gateway checks the signature, expiry, issuer and
      # audience itself, so anonymous or forged requests are rejected before
      # Lambda runs (no invocation, no OpenAI cost). The app still verifies the
      # token too (middleware/firebase_middleware.py).
      Auth:
        DefaultAuthorizer: FirebaseJwt
        Authorizers:
          FirebaseJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://securetoken.google.com/${FirebaseProjectId}"
              audience:
                - !Ref FirebaseProjectId
      # CORS lives at the gateway so preflight (OPTIONS) requests, which carry
      # no token, are answered here, and so 401s from the authorizer still get
      # CORS headers (otherwise the browser reports them as CORS errors). While
      # this is set, API Gateway ignores the CORS headers FastAPI adds; keep the
      # origins in sync with main.py, which still handles CORS for local runs.
      # Production origins only: the local dev server (localhost:3000) is
      # allowed by main.py when running locally, never by the deployed API.
      CorsConfiguration:
        AllowOrigins:
          - https://dbaichat.space
          - https://mcpfrontend.web.app
        AllowMethods: ["GET", "POST", "DELETE", "OPTIONS"]
        AllowHeaders: ["authorization", "content-type"]
        ExposeHeaders: ["x-request-id"]
        AllowCredentials: true
        MaxAge: 600

  MCPBEFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Environment:
        Variables:
          SSM_PREFIX: !Sub "/mcpbe/${AppEnv}"
          POWERTOOLS_SERVICE_NAME: mcpbe
          POWERTOOLS_LOG_LEVEL: INFO
      # GetParametersByPath authorises against the path ARN (no /*), while
      # GetParameter needs the wildcard — both statements are required. kms:Decrypt
      # can't be scoped to an alias, so it's constrained by kms:ViaService instead.
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: ssm:GetParametersByPath
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mcpbe/${AppEnv}"
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mcpbe/${AppEnv}/*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
      Events:
        # Everything not listed further down: Firebase token required
        # (DefaultAuthorizer). One route per method on purpose, NOT `ANY`: an
        # ANY route also matches OPTIONS, which sends the browser's CORS
        # preflight (never carries a token) through the authorizer -> 401 ->
        # the browser reports a CORS error. With no OPTIONS route, API Gateway
        # answers preflights itself from CorsConfiguration, without Lambda.
        ProxyGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref MCPBEHttpApi
            Path: /{proxy+}
            Method: GET
        ProxyPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MCPBEHttpApi
            Path: /{proxy+}
            Method: POST
        ProxyDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref MCPBEHttpApi
            Path: /{proxy+}
            Method: DELETE
        # Public routes — the same list firebase_middleware.py lets through.
        # A specific path beats /{proxy+}, so these skip the authorizer.
        HealthApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MCPBEHttpApi
            Path: /
            Method: GET
            Auth:
              Authorizer: NONE
        DocsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MCPBEHttpApi
            Path: /docs
            Method: GET
            Auth:
              Authorizer: NONE
        RedocApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MCPBEHttpApi
            Path: /redoc
            Method: GET
            Auth:
              Authorizer: NONE
        OpenApiSchema:
          Type: HttpApi
          Properties:
            ApiId: !Ref MCPBEHttpApi
            Path: /openapi.json
            Method: GET
            Auth:
              Authorizer: NONE
    Metadata:
      DockerContext: .
      Dockerfile: Dockerfile
      DockerTag: latest

Outputs:
  ApiUrl:
    Description: Base URL of the deployed API
    Value: !Sub "https://${MCPBEHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
